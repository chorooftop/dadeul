# Cloud Build — apps/api 이미지 빌드
#
# 로컬 docker 없이 GCP에서 빌드한다. 호출:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=asia-northeast1-docker.pkg.dev/$PROJECT/dadeul/api:$(git rev-parse --short HEAD)
#
# Dockerfile이 apps/api에 있고 빌드 컨텍스트는 저장소 루트라(npm workspace lockfile이 루트에 있다)
# `gcloud builds submit --tag` 대신 이 설정 파일을 쓴다 — --tag는 루트의 Dockerfile만 본다.

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'apps/api/Dockerfile', '-t', '$_IMAGE', '.']

images:
  - '$_IMAGE'

options:
  # 사용자 소유 로그 버킷을 따로 만들지 않는다 — 기본 동작이 요구하는 버킷 권한 설정을 피한다
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s
